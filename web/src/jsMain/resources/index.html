<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Penal</title>
  <style>
    #resultado { white-space: pre-line; margin-top: 1em; }
    label { display: block; margin: .5em 0; }
  </style>
</head>
<body>
  <h1>Calculadora Penal</h1>

  <!-- botão sempre visível; o texto da mensagem já vai codificado para URL (%20 = espaço) -->
  <!-- rel="noopener": a aba do WhatsApp não consegue controlar esta página (segurança) -->
  <p><a href="https://wa.me/5511989498044?text=Ol%C3%A1!%20Vim%20pela%20Calculadora%20Penal%20e%20gostaria%20de%20falar%20com%20um%20advogado."
        target="_blank" rel="noopener">Quero Falar com um Advogado</a></p>

  <form id="formulario">
    <fieldset>
      <legend>Pena total (some todas as condenações)</legend>
      <label>Anos <input id="anos" type="number" min="0" value="0"></label>
      <label>Meses <input id="meses" type="number" min="0" value="0"></label>
      <label>Dias <input id="dias" type="number" min="0" value="0"></label>
    </fieldset>

    <label>Data do fato (quando o crime foi cometido) <input id="dataDoFato" type="date"></label>
    <label>Início do cumprimento da pena <input id="inicio" type="date"></label>

    <label>Tipo de crime
      <select id="tipo">
        <option value="COMUM">Comum (sem violência)</option>
        <option value="VIOLENCIA_OU_GRAVE_AMEACA">Com violência ou grave ameaça</option>
        <option value="HEDIONDO">Hediondo ou equiparado</option>
        <option value="HEDIONDO_COM_MORTE">Hediondo com resultado morte</option>
      </select>
    </label>

    <label><input id="reincidente" type="checkbox"> Reincidente</label>

    <label>Regime inicial fixado na sentença
      <select id="regime">
        <option value="FECHADO">Fechado</option>
        <option value="SEMIABERTO">Semiaberto</option>
      </select>
    </label>

    <label>Detração (dias de prisão provisória) <input id="detracao" type="number" min="0" value="0"></label>

    <button type="submit">Calcular</button>
  </form>

  <div id="resultado"></div>

  <!-- "hidden": só aparece depois de um cálculo bem-sucedido -->
  <section id="contato" hidden>
    <h2>Envie o resultado ao escritório</h2>
    <p>Seus dados não ficam guardados neste site: eles vão apenas na mensagem que você enviar pelo WhatsApp.</p>
    <form id="formContato">
      <label>Nome completo* <input id="nome" type="text" autocomplete="name"></label>
      <label>WhatsApp com DDD* <input id="whatsapp" type="tel" autocomplete="tel" placeholder="11987654321"></label>
      <label>E-mail <input id="email" type="email" autocomplete="email"></label>
      <label>Número do processo <input id="processo" type="text" inputmode="numeric" placeholder="NNNNNNN-DD.AAAA.J.TR.OOOO"></label>
      <button type="submit">Quero Falar com um Advogado</button>
    </form>
    <div id="avisoContato"></div>
  </section>

  <script src="web.js"></script>
</body>
</html>
